<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>商品管理列表 - 仓库管理平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; min-height: 100vh; }

    .navbar { background: #1f1f1f; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .navbar .title { color: #fff; font-size: 18px; font-weight: bold; }
    .navbar .nav-links { display: flex; gap: 12px; align-items: center; }
    .navbar .nav-links a { color: #ccc; text-decoration: none; padding: 6px 14px; border-radius: 4px; font-size: 14px; transition: all 0.2s; }
    .navbar .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .navbar .nav-links a.active { color: #4CAF50; border: 1px solid #4CAF50; }

    .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .page-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .page-header h2 { font-size: 20px; color: #333; }
    .add-btn { padding: 8px 20px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: auto; transition: background 0.2s; text-decoration: none; }
    .add-btn:hover { background: #43A047; }

    .table-wrapper { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #fafafa; }
    th { padding: 12px 14px; text-align: left; color: #666; font-weight: 600; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; color: #333; }
    tr:hover td { background: #f9f9f9; }
    .warning-row td { background: #ffebee !important; color: #d32f2f !important; font-weight: bold; }

    .btn-edit { padding: 4px 12px; background: #FF9800; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; margin-right: 6px; }
    .btn-edit:hover { background: #F57C00; }
    .btn-del { padding: 4px 12px; background: #f44336; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; }
    .btn-del:hover { background: #d32f2f; }
  </style>
</head>
<body>

<div class="navbar">
    <div class="title">仓库管理平台</div>
    <div class="nav-links">
        <a href="/admin" class="active">📋 返回管理后台</a>
        <a href="/logout">🔓 退出登录</a>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <span>📦</span>
        <h2>商品信息管理</h2>
        <a href="/goods/toAdd" class="add-btn">+ 新增商品</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>商品ID</th>
                <th>商品名称</th>
                <th>单价</th>
                <th>商品分类</th>
                <th>库存</th>
                <th>预警值</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${list}" th:class="${item.quantity < item.alertQuantity ? 'warning-row' : ''}">
                <td th:text="${item.gid}"></td>
                <td th:text="${item.gname}"></td>
                <td th:text="${item.price}"></td>
                <td>
                    <th:block th:switch="${item.cid}">
                        <span th:case="1">电子产品</span>
                        <span th:case="2">生活用品</span>
                        <span th:case="3">服装配饰</span>
                        <span th:case="4">食品饮料</span>
                        <span th:case="*">其他</span>
                    </th:block>
                </td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.alertQuantity}"></td>
                <td>
                    <a th:href="@{/goods/toEdit(gid=${item.gid})}" class="btn-edit">修改</a>
                    <a th:href="@{/goods/del(gid=${item.gid})}" class="btn-del">删除</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(list)}">
                <td colspan="7" style="text-align:center;color:#999;padding:40px;">暂无商品数据</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
