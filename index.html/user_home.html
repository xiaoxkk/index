<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库管理-首页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: #1f1f1f;
      color: white;
      padding: 0 40px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-brand {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-info {
      color: #ccc;
      font-size: 14px;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid #4CAF50;
      color: #4CAF50;
      padding: 6px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      transition: all 0.3s;
    }
    .btn-logout:hover {
      background: #4CAF50;
      color: #fff;
    }
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .cards-wrapper {
      display: flex;
      gap: 30px;
      max-width: 960px;
      width: 100%;
    }
    .card {
      flex: 1;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      transition: box-shadow 0.3s, transform 0.3s;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .card-icon { font-size: 48px; margin-bottom: 16px; }
    .card-title { font-size: 22px; font-weight: 700; color: #1f1f1f; margin-bottom: 8px; }
    .card-desc { font-size: 14px; color: #999; margin-bottom: 24px; text-align: center; line-height: 1.6; }
    .btn-card {
      background: #4CAF50;
      color: white;
      padding: 10px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.3s;
    }
    .btn-card:hover { background: #43A047; }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="/user">仓库管理平台</a>
  <div class="navbar-right">
    <span class="user-info" th:text="'当前用户：' + ${session.loginUser?.uname}"></span>
    <a class="btn-logout" href="/user/logout">退出登录</a>
  </div>
</nav>

<div class="main-container">
  <div class="cards-wrapper">
    <div class="card">
      <div class="card-icon">📦</div>
      <div class="card-title">取货/退货申请</div>
      <div class="card-desc">提交取货或退货申请，管理出库与退货流程</div>
      <a class="btn-card" href="/apply/view">进入申请</a>
    </div>
    <div class="card">
      <div class="card-icon">📋</div>
      <div class="card-title">品类查询</div>
      <div class="card-desc">按商品类别浏览与检索，快速找到所需商品</div>
      <a href="/category" class="btn-card">进入品类列表</a>
    </div>
  </div>
</div>

</body>
</html>
