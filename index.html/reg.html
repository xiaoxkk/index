<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓储系统 - 新用户注册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #fff; border: 1px solid #e0e0e0;
      border-radius: 8px; padding: 40px; width: 400px;
    }
    .login-box h2 { text-align: center; margin-bottom: 24px; color: #1f1f1f; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px;
    }
    .form-group input:focus { border-color: #4CAF50; outline: none; }
    .gender-group { margin-bottom: 20px; }
    .gender-group > label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
    .gender-options { display: flex; gap: 12px; }
    .gender-option { flex: 1; position: relative; }
    .gender-option input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
    .gender-option label {
      display: block; text-align: center; padding: 12px;
      border: 2px solid #ddd; border-radius: 8px; cursor: pointer;
      font-size: 15px; font-weight: 500; color: #666; transition: all 0.3s;
    }
    .gender-option input[type="radio"]:checked + label {
      border-color: #4CAF50; color: #4CAF50; background: #f1f8f1;
    }
    .btn-register {
      width: 100%; background: #4CAF50; color: white; padding: 12px;
      border: none; border-radius: 6px; font-size: 16px; font-weight: 500;
      cursor: pointer; transition: background 0.3s;
    }
    .btn-register:hover { background: #43A047; }
    .msg { color: #e53935; font-size: 13px; text-align: center; margin-bottom: 12px; }
    .back-link { text-align: center; margin-top: 16px; }
    .back-link a { color: #4CAF50; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
<div class="login-box">
  <h2>📦 仓储系统 - 新用户注册</h2>

  <div class="msg" th:if="${msg}" th:text="${msg}">错误信息</div>

  <form th:action="@{/user/register}" method="post">
    <div class="form-group">
      <label>账号</label>
      <input type="text" name="uname" placeholder="请输入账号" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="upwd" placeholder="请输入密码" required>
    </div>
    <div class="gender-group">
      <label>性别</label>
      <div class="gender-options">
        <div class="gender-option">
          <input type="radio" id="male" name="usex" value="男" checked>
          <label for="male">👨 男</label>
        </div>
        <div class="gender-option">
          <input type="radio" id="female" name="usex" value="女">
          <label for="female">👩 女</label>
        </div>
      </div>
    </div>
    <button type="submit" class="btn-register">注 册</button>
  </form>

  <div class="back-link">
    <a href="/user/toLogin">已有账号？去登录</a>
  </div>
</div>
</body>
</html>
