<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 - 仓库管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* 导航栏 */
    .navbar {
      background: #1f1f1f; color: white; padding: 0 40px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .navbar-left { display: flex; align-items: center; gap: 28px; }
    .navbar-brand { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; }
    .cat-dropdown { position: relative; }
    .cat-dropdown-trigger {
      color: #ccc; font-size: 15px; cursor: pointer;
      padding: 8px 14px; border-radius: 6px; transition: all 0.3s;
      display: flex; align-items: center; gap: 4px; user-select: none;
    }
    .cat-dropdown-trigger:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .cat-dropdown-menu {
      display: none; position: absolute; top: calc(100%); left: 0;
      background: #2a2a2a; border-radius: 8px; min-width: 160px;
      padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .cat-dropdown:hover .cat-dropdown-menu { display: block; }
    .cat-dropdown-menu a {
      display: block; color: #ccc; text-decoration: none;
      padding: 10px 20px; font-size: 14px; transition: all 0.2s;
    }
    .cat-dropdown-menu a:hover { color: #fff; background: #4CAF50; }
    .navbar-right { display: flex; align-items: center; gap: 16px; }
    .nav-link { color: #ccc; text-decoration: none; font-size: 14px; transition: color 0.3s; }
    .nav-link:hover { color: #fff; }
    .user-info { color: #ccc; font-size: 14px; }
    .btn-logout {
      background: transparent; border: 1px solid #4CAF50; color: #4CAF50;
      padding: 6px 16px; border-radius: 6px; text-decoration: none;
      font-size: 13px; transition: all 0.3s;
    }
    .btn-logout:hover { background: #4CAF50; color: #fff; }
    .btn-login {
      background: #4CAF50; color: white; padding: 8px 20px;
      border-radius: 6px; text-decoration: none; font-size: 14px;
      transition: background 0.3s;
    }
    .btn-login:hover { background: #43A047; }

    /* 主体 */
    .main-wrapper {
      flex: 1; display: flex; max-width: 1400px; width: 100%;
      margin: 0 auto; padding: 24px 40px; gap: 24px;
    }

    /* 左侧分类栏 */
    .sidebar {
      width: 200px; flex-shrink: 0; background: #fff;
      border: 1px solid #e0e0e0; border-radius: 8px;
      overflow: hidden; align-self: flex-start;
      position: sticky; top: 84px;
    }
    .sidebar-title {
      background: #1f1f1f; color: #fff;
      padding: 14px 20px; font-size: 15px; font-weight: 600;
    }
    .sidebar-cat-name {
      padding: 12px 20px; font-size: 14px; font-weight: 600;
      color: #4CAF50; background: #f0f7f0;
      border-bottom: 1px solid #e0e0e0;
    }
    .sidebar-list { list-style: none; }
    .sidebar-list li a {
      display: block; padding: 10px 20px; color: #333;
      text-decoration: none; font-size: 13px;
      border-bottom: 1px solid #f5f5f5; transition: all 0.2s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-list li a:hover { background: #f0f7f0; color: #4CAF50; }
    .sidebar-list li a.active {
      background: #e8f5e9; color: #4CAF50; font-weight: 600;
      border-left: 3px solid #4CAF50;
    }

    /* 右侧详情 */
    .detail-area { flex: 1; min-width: 0; }

    /* 内容头部 + 搜索 */
    .content-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .breadcrumb { font-size: 13px; color: #999; }
    .breadcrumb a { color: #4CAF50; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span { margin: 0 6px; }
    .search-box {
      display: flex; align-items: center; gap: 0;
      background: #fff; border: 1px solid #ddd; border-radius: 20px;
      overflow: hidden; transition: border-color 0.3s;
    }
    .search-box:focus-within { border-color: #4CAF50; }
    .search-box input {
      border: none; outline: none; padding: 8px 16px;
      font-size: 14px; width: 200px; background: transparent;
    }
    .search-box button {
      background: #4CAF50; color: #fff; border: none;
      padding: 8px 14px; cursor: pointer; font-size: 14px;
      transition: background 0.3s;
    }
    .search-box button:hover { background: #43A047; }

    /* 商品主信息 */
    .product-main {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      display: flex; gap: 40px; padding: 32px; margin-bottom: 20px;
    }
    .product-img {
      width: 320px; height: 320px; flex-shrink: 0;
      background: #fafafa; border: 1px solid #eee; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 80px;
    }
    .product-info { flex: 1; display: flex; flex-direction: column; }
    .product-name {
      font-size: 22px; font-weight: 700; color: #1f1f1f;
      line-height: 1.4; margin-bottom: 8px;
    }
    .product-category-tag {
      display: inline-block; background: #e8f5e9; color: #4CAF50;
      padding: 4px 12px; border-radius: 4px; font-size: 12px;
      font-weight: 500; margin-bottom: 20px; align-self: flex-start;
    }
    .product-price-box {
      background: #fdf6f0; padding: 16px 20px;
      border-radius: 8px; margin-bottom: 20px;
    }
    .product-price-label { font-size: 13px; color: #999; margin-bottom: 4px; }
    .product-price { font-size: 32px; font-weight: 700; color: #f44336; }
    .product-price .yuan { font-size: 16px; font-weight: 500; }
    .product-price .unit { font-size: 14px; color: #999; font-weight: 400; margin-left: 4px; }

    .product-quick-info {
      display: flex; flex-direction: column; gap: 12px;
      font-size: 14px; color: #666;
    }
    .quick-row { display: flex; align-items: center; gap: 8px; }
    .quick-label { width: 80px; color: #999; flex-shrink: 0; }
    .stock-ok { color: #4CAF50; font-weight: 500; }
    .stock-warn { color: #f44336; font-weight: 600; }

    /* 规格参数 */
    .product-detail-section {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 28px 32px;
    }
    .section-title {
      font-size: 16px; font-weight: 700; color: #1f1f1f;
      padding-bottom: 16px; border-bottom: 1px solid #eee; margin-bottom: 20px;
    }
    .spec-table { width: 100%; border-collapse: collapse; }
    .spec-table th {
      text-align: left; padding: 14px 16px; background: #fafafa;
      color: #999; font-weight: 500; font-size: 13px;
      border: 1px solid #f0f0f0; width: 120px;
    }
    .spec-table td {
      padding: 14px 16px; font-size: 14px; color: #333; border: 1px solid #f0f0f0;
    }
    .btn-reserve {
      display: inline-block; background: #4CAF50; color: #fff;
      padding: 12px 32px; border-radius: 6px; text-decoration: none;
      font-size: 15px; font-weight: 600; transition: background 0.3s;
      margin-top: 16px; align-self: flex-start;
    }
    .btn-reserve:hover { background: #43A047; }
    /* 空状态 */
    .empty-state {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 60px 40px; text-align: center;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-text { color: #999; font-size: 15px; }
    .empty-text a { color: #4CAF50; text-decoration: none; }
    .empty-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- 导航栏 -->
<div class="navbar">
  <div class="navbar-left">
    <a class="navbar-brand" href="/">仓库管理平台</a>
    <div class="cat-dropdown">
      <div class="cat-dropdown-trigger">📂 品类 ▾</div>
      <div class="cat-dropdown-menu">
        <a th:each="cat : ${categories}" th:href="@{/category(cid=${cat.cid})}" th:text="${cat.cname}">分类</a>
        <a th:href="@{/category}">全部商品</a>
      </div>
    </div>
  </div>
  <div class="navbar-right">
    <a class="nav-link" href="/user">🏠 回首页</a>
    <span th:if="${session.loginUser != null}" class="user-info" th:text="'👤 ' + ${session.loginUser.uname}"></span>
    <a th:if="${session.loginUser != null}" class="btn-logout" href="/user/logout">退出登录</a>
    <a th:if="${session.loginUser == null}" class="btn-login" href="/user/toLogin">前往登录</a>
  </div>
</div>

<!-- 主体 -->
<div class="main-wrapper">

  <!-- 左侧：当前分类商品列表 -->
  <div class="sidebar" th:if="${goods != null}">
    <div class="sidebar-title">📂 商品分类</div>
    <div class="sidebar-cat-name" th:text="${categoryName}">果汁</div>
    <ul class="sidebar-list">
      <li th:each="item : ${categoryGoods}">
        <a th:href="@{/category/detail(gid=${item.gid})}"
           th:text="${item.gname}"
           th:classappend="${item.gid == goods.gid} ? 'active' : ''">商品名</a>
      </li>
    </ul>
  </div>

  <!-- 右侧详情 -->
  <div class="detail-area" th:if="${goods != null}">

    <!-- 头部 + 搜索 -->
    <div class="content-header">
      <div class="breadcrumb">
        <a href="/">首页</a><span>›</span>
        <a th:href="@{/category(cid=${goods.cid})}">品类查询</a><span>›</span>
        <span th:text="${goods.gname}">商品详情</span>
      </div>
      <form class="search-box" th:action="@{/category/search}" method="get">
        <input type="text" name="keyword" placeholder="搜索商品名称...">
        <input type="hidden" name="from" value="detail">
        <button type="submit">🔍</button>
      </form>
    </div>

    <!-- 商品主信息 -->
    <div class="product-main">
      <div class="product-img">📦</div>
      <div class="product-info">
        <div class="product-name" th:text="${goods.gname}">商品名称</div>
        <div class="product-category-tag" th:text="${categoryName}">分类名</div>
        <div class="product-price-box">
          <div class="product-price-label">单价</div>
          <div class="product-price">
            <span class="yuan">¥</span><span th:text="${goods.price}">0.00</span>
            <span class="unit" th:text="'/ ' + ${goods.unit}">/ 个</span>
          </div>
        </div>
        <div class="product-quick-info">
          <div class="quick-row">
            <span class="quick-label">商品编号</span>
            <span th:text="${goods.gid}">1</span>
          </div>
          <div class="quick-row">
            <span class="quick-label">计量单位</span>
            <span th:text="${goods.unit}">个</span>
          </div>
          <div class="quick-row">
            <span class="quick-label">当前库存</span>
            <span th:if="${goods.quantity > goods.alertQuantity}" class="stock-ok" th:text="${goods.quantity}">0</span>
            <span th:if="${goods.quantity <= goods.alertQuantity}" class="stock-warn" th:text="${goods.quantity} + ' ⚠ 库存不足'">0</span>
          </div>
          <div class="quick-row">
            <a class="btn-reserve" th:href="@{/reservation(gid=${goods.gid})}">📅 预约取货</a>
          </div>
        </div>
      </div>
    </div>

    <!-- 规格参数 -->
    <div class="product-detail-section">
      <div class="section-title">规格参数</div>
      <table class="spec-table">
        <tr><th>商品编号</th><td th:text="${goods.gid}">1</td></tr>
        <tr><th>商品名称</th><td th:text="${goods.gname}">商品名称</td></tr>
        <tr><th>所属分类</th><td th:text="${categoryName}">分类名</td></tr>
        <tr><th>计量单位</th><td th:text="${goods.unit}">个</td></tr>
        <tr><th>单价</th><td th:text="'¥' + ${goods.price}">¥0.00</td></tr>
        <tr><th>当前库存</th>
          <td>
            <span th:if="${goods.quantity > goods.alertQuantity}" class="stock-ok" th:text="${goods.quantity}">0</span>
            <span th:if="${goods.quantity <= goods.alertQuantity}" class="stock-warn" th:text="${goods.quantity} + ' ⚠ 低于预警值'">0</span>
          </td>
        </tr>
        <tr><th>预警数量</th><td th:text="${goods.alertQuantity}">10</td></tr>
      </table>
    </div>
  </div>

  <!-- 空状态 -->
  <div class="detail-area" th:if="${goods == null}">
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">未找到该商品，<a th:href="@{/category}">返回品类列表</a></div>
    </div>
  </div>

</div>

</body>
</html>
