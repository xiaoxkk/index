<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户申请审核</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      margin: 30px;
    }
    h2 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f5f5f5;
    }
    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      color: #fff;
    }
    .btn-pass {
      background-color: #28a745;
    }
    .btn-reject {
      background-color: #dc3545;
    }
    .back {
      margin-bottom: 15px;
      background: #6c757d;
    }
  </style>
</head>
<body>

<h2>管理员 - 用户申请审核</h2>

<button class="btn back" onclick="history.back()">返回上一页</button>

<table>
  <thead>
  <tr>
    <th>申请ID</th>
    <th>用户ID</th>
    <th>商品ID</th>
    <th>申请类型</th>
    <th>数量</th>
    <th>状态</th>
    <th>申请时间</th>
    <th>操作</th>
  </tr>
  </thead>
  <tbody>
  <!-- 循环显示申请列表 -->
  <tr th:each="item : ${list}">
    <td th:text="${item.id}"></td>
    <td th:text="${item.uid}"></td>
    <td th:text="${item.gid}" class="gid-text"></td>
    <td th:text="${item.type == 1 ? '入库' : '出库'}"></td>
    <td th:text="${item.quantity}"></td>
    <td th:text="${item.status == 0 ? '待审核' : (item.status == 1 ? '已通过' : '已驳回')}"></td>
    <td th:text="${item.createTime}"></td>
    <td>
      <!-- 只有待审核才能操作 -->
      <div th:if="${item.status == 0}">
        <!-- 通过 -->
        <form method="post" th:action="@{/admin/apply/pass}" style="display: inline;" class="pass-form">
          <input type="hidden" name="applyId" th:value="${item.id}">
          <input type="hidden" class="form-gid" th:value="${item.gid}">
          <button type="submit" class="btn btn-pass">通过</button>
        </form>
        <!-- 驳回 -->
        <form method="post" th:action="@{/admin/apply/reject}" style="display: inline;">
          <input type="hidden" name="applyId" th:value="${item.id}">
          <button type="submit" class="btn btn-reject">驳回</button>
        </form>
      </div>
      <span th:else>已处理</span>
    </td>
  </tr>

  <!-- 无数据时显示 -->
  <tr th:if="${#lists.isEmpty(list)}">
    <td colspan="8">暂无申请记录</td>
  </tr>
  </tbody>
</table>

<script>
  // 提交通过前自动校验：商品ID是否存在
  document.querySelectorAll('.pass-form').forEach(form => {
    form.addEventListener('submit', function (e) {
      // 1. 阻止默认提交，必须校验通过才放行
      e.preventDefault();

      // 2. 获取当前行的商品ID
      const gid = form.querySelector('.form-gid').value;

      // 3. 校验ID为空
      if (!gid || gid.trim() === '') {
        alert('商品ID不能为空，无法通过！');
        return;
      }

      // 4. 同步校验商品是否存在（不用await，直接发同步请求）
      let exists = false;
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "/goods/exists?gid=" + gid, false); // false=同步请求
      xhr.send();

      if (xhr.status === 200) {
        exists = xhr.responseText === "true";
      }

      if (!exists) {
        alert('商品ID不存在，不能提交通过！');
        return;
      }

      // 5. 校验全部通过，手动提交表单
      form.submit();
    });
  });
</script>

</body>
</html>
