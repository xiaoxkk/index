<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约管理 - 仓库管理平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; min-height: 100vh; }

    /* 导航栏 */
    .navbar { background: #1f1f1f; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .navbar .title { color: #fff; font-size: 18px; font-weight: bold; }
    .navbar .nav-links { display: flex; gap: 12px; align-items: center; }
    .navbar .nav-links a { color: #ccc; text-decoration: none; padding: 6px 14px; border-radius: 4px; font-size: 14px; transition: all 0.2s; }
    .navbar .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .navbar .nav-links a.active { color: #4CAF50; border: 1px solid #4CAF50; }

    /* 内容区 */
    .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .page-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .page-header h2 { font-size: 20px; color: #333; }

    /* 筛选栏 */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-btn { padding: 6px 16px; border: 1px solid #ddd; background: #fff; border-radius: 20px; cursor: pointer; font-size: 13px; color: #666; transition: all 0.2s; }
    .filter-btn:hover { border-color: #4CAF50; color: #4CAF50; }
    .filter-btn.active { background: #4CAF50; color: #fff; border-color: #4CAF50; }

    /* 表格 */
    .table-wrapper { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #fafafa; }
    th { padding: 12px 14px; text-align: left; color: #666; font-weight: 600; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; color: #333; vertical-align: top; }
    tr:hover td { background: #f9f9f9; }

    /* 状态标签 */
    .status-tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .status-pending { background: #FFF3E0; color: #E65100; }
    .status-confirmed { background: #E8F5E9; color: #2E7D32; }
    .status-rejected { background: #FFEBEE; color: #C62828; }

    /* 操作区 */
    .action-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .action-row:last-child { margin-bottom: 0; }
    .action-input { flex: 1; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
    .action-input:focus { border-color: #4CAF50; }
    .btn-confirm { padding: 5px 14px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn-confirm:hover { background: #43A047; }
    .btn-reject { padding: 5px 14px; background: #f44336; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn-reject:hover { background: #e53935; }
  </style>
</head>
<body>
<!-- 导航栏 -->
<div class="navbar">
  <div class="title">仓库管理平台</div>
  <div class="nav-links">
    <a href="/">🏠 前台</a>
    <a href="/admin" class="active">📋 返回管理后台</a>
  </div>
</div>

<div class="container">
  <div class="page-header">
    <span style="font-size:22px;">📅</span>
    <h2>预约管理</h2>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterStatus('all')">全部</button>
    <button class="filter-btn" onclick="filterStatus(0)">⏳ 待确认</button>
    <button class="filter-btn" onclick="filterStatus(1)">✅ 已确认</button>
    <button class="filter-btn" onclick="filterStatus(2)">❌ 已拒绝</button>
  </div>

  <!-- 预约列表 -->
  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>编号</th>
        <th>商品</th>
        <th>预约数量</th>
        <th>邮箱</th>
        <th>取货时间</th>
        <th>取货地点</th>
        <th>状态</th>
        <th>提交时间</th>
        <th style="min-width:260px;">操作</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="res : ${reservations}" th:attr="data-status=${res.status}">
        <td th:text="${res.rid}"></td>
        <td th:text="${res.adminRemark}"></td>
        <td th:text="${res.quantity}"></td>
        <td th:text="${res.email}"></td>
        <td th:text="${res.pickupTime}"></td>
        <td th:text="${res.pickupLocation}"></td>
        <td>
          <span th:if="${res.status == 0}" class="status-tag status-pending">待确认</span>
          <span th:if="${res.status == 1}" class="status-tag status-confirmed">已确认</span>
          <span th:if="${res.status == 2}" class="status-tag status-rejected">已拒绝</span>
        </td>
        <td th:text="${res.createTime}"></td>
        <td>
          <!-- 待确认状态才显示操作 -->
          <th:block th:if="${res.status == 0}">
            <!-- 确认行：备注 + 确认按钮 -->
            <div class="action-row">
              <button type="button" class="btn-confirm" th:data-rid="${res.rid}" onclick="confirmReservation(this)">确认</button>
              <input type="text" class="action-input" name="remark" placeholder="备注（选填）"/>
            </div>
            <!-- 拒绝行：拒绝按钮 + 拒绝原因 -->
            <div class="action-row">
              <button type="button" class="btn-reject" th:data-rid="${res.rid}" onclick="rejectReservation(this)">拒绝</button>
              <input type="text" class="action-input" name="rejectReason" placeholder="拒绝原因（选填）"/>
            </div>
          </th:block>
          <th:block th:if="${res.status != 0}">
            <span style="color:#999; font-size:13px;">—</span>
          </th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 状态筛选
  function filterStatus(status) {
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');

    var rows = document.querySelectorAll('tbody tr');
    rows.forEach(function(row) {
      if (status === 'all') {
        row.style.display = '';
      } else {
        var rowStatus = row.getAttribute('data-status');
        row.style.display = (rowStatus == status) ? '' : 'none';
      }
    });
  }

  // 确认预约
  function confirmReservation(btn) {
    var rid = btn.getAttribute('data-rid');
    var td = btn.closest('td');
    var remarkInput = td.querySelector('input[name="remark"]');
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/reservation/confirm/' + rid;
    if (remarkInput && remarkInput.value) {
      var hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = 'adminRemark';
      hidden.value = remarkInput.value;
      form.appendChild(hidden);
    }
    document.body.appendChild(form);
    form.submit();
  }
  //拒绝预约
  function rejectReservation(btn) {
    var rid = btn.getAttribute('data-rid');
    var td = btn.closest('td');
    var reasonInput = td.querySelector('input[name="rejectReason"]');
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/reservation/reject/' + rid;
    if (reasonInput && reasonInput.value) {
      var hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = 'adminRemark';
      hidden.value = reasonInput.value;
      form.appendChild(hidden);
    }
    document.body.appendChild(form);
    form.submit();
  }
</script>
</body>
</html>
