<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的申请管理</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 20px;
        }
        h2, h3 {
            color: #333;
        }
        .success-msg {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        form {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
        }
        label {
            display: inline-block;
            width: 100px;
            margin-top: 8px;
        }
        input, select {
            padding: 6px;
            width: 200px;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-btn {
            background-color: #6c757d;
            margin-bottom: 15px;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<h2>我的申请管理</h2>

<!-- 返回用户主页面按钮 -->
<button class="back-btn" onclick="window.location.href='/user'">返回用户主页面</button>

<!-- 成功提示：?success=1 时显示 -->
<div th:if="${param.success != null}" class="success-msg">
    ✅ 提交成功！
</div>

<!-- 错误提示：JS 动态显示 -->
<div id="errorMsg" class="error-msg" style="display:none;"></div>

<!-- 申请表单：加了 onsubmit 校验 -->
<form id="applyForm" th:action="@{/apply/submit}" method="post" onsubmit="return checkGidExists()">
    <div>
        <label>商品ID：</label>
        <input type="number" id="gidInput" name="gid" required>
    </div>
    <div>
        <label>申请类型：</label>
        <select name="type" required>
            <option value="">请选择类型</option>
            <option value="入库">入库</option>
            <option value="出库">出库</option>
        </select>
    </div>
    <div>
        <label>数量：</label>
        <input type="number" name="quantity" min="1" required>
    </div>
    <div>
        <button type="submit">提交申请</button>
    </div>
</form>

<hr>

<!-- 申请记录列表 -->
<h3>我的申请记录</h3>
<table>
    <thead>
    <tr>
        <th>申请ID</th>
        <th>商品ID</th>
        <th>类型</th>
        <th>数量</th>
        <th>状态</th>
        <th>申请时间</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${applyList}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.gid}"></td>
        <td th:text="${item.type == 1 ? '入库' : '出库'}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.status == 0 ? '待审批' : (item.status == 1 ? '已通过' : '已驳回')}"></td>
        <td th:text="${item.createTime}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(applyList)}">
        <td colspan="6">暂无申请记录</td>
    </tr>
    </tbody>
</table>

<script>
    // 提交前校验：商品ID必须存在
    function checkGidExists() {
        const gid = document.getElementById("gidInput").value.trim();
        const errorBox = document.getElementById("errorMsg");
        errorBox.style.display = "none";

        // 1. 非空/数字校验（input 有 required，这里做兜底）
        if (!gid || !/^\d+$/.test(gid)) {
            errorBox.innerText = "❌ 请输入有效的商品ID（数字）";
            errorBox.style.display = "block";
            return false;
        }

        // 2. 同步请求后端接口，判断商品是否存在
        let exists = false;
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "/goods/exists?gid=" + gid, false); // false=同步，等结果再提交
        xhr.send();

        if (xhr.status === 200) {
            exists = xhr.responseText === "true";
        }

        if (!exists) {
            errorBox.innerText = "❌ 商品ID不存在，无法提交申请";
            errorBox.style.display = "block";
            return false; // 拦截提交
        }

        // 校验通过，允许提交
        return true;
    }
</script>

</body>
</html>
