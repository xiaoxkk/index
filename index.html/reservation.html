<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品预约 - 仓库管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .navbar {
      background: #1f1f1f; color: white; padding: 0 40px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .navbar-brand { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; }
    .navbar-right { display: flex; align-items: center; gap: 16px; }
    .nav-link { color: #ccc; text-decoration: none; font-size: 14px; transition: color 0.3s; }
    .nav-link:hover { color: #fff; }
    .user-info { color: #ccc; font-size: 14px; }
    .btn-logout {
      background: transparent; border: 1px solid #4CAF50; color: #4CAF50;
      padding: 6px 16px; border-radius: 6px; text-decoration: none;
      font-size: 13px; transition: all 0.3s;
    }
    .btn-logout:hover { background: #4CAF50; color: #fff; }

    .main-wrapper {
      flex: 1; max-width: 800px; width: 100%;
      margin: 0 auto; padding: 40px 20px;
    }
    .breadcrumb { font-size: 13px; color: #999; margin-bottom: 24px; }
    .breadcrumb a { color: #4CAF50; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span { margin: 0 6px; }

    .reserve-card {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 32px; margin-bottom: 20px;
    }
    .reserve-title {
      font-size: 20px; font-weight: 700; color: #1f1f1f;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee;
    }
    .goods-summary {
      display: flex; align-items: center; gap: 20px;
      padding: 16px; background: #fafafa; border-radius: 8px;
      margin-bottom: 28px;
    }
    .goods-icon { font-size: 48px; }
    .goods-info h3 { font-size: 18px; font-weight: 600; color: #1f1f1f; margin-bottom: 4px; }
    .goods-info p { font-size: 14px; color: #666; }
    .goods-info .price { font-size: 22px; font-weight: 700; color: #f44336; }
    .stock-tag {
      display: inline-block; padding: 2px 10px; border-radius: 4px;
      font-size: 12px; font-weight: 500; margin-left: 8px;
    }
    .stock-ok { background: #e8f5e9; color: #4CAF50; }
    .stock-warn { background: #fff3e0; color: #ff9800; }
    .stock-low { background: #fce4ec; color: #f44336; }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 14px; font-weight: 600;
      color: #333; margin-bottom: 8px;
    }
    .form-group label .required { color: #f44336; margin-left: 2px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; transition: border-color 0.3s;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #4CAF50; outline: none;
    }
    .form-hint { font-size: 12px; color: #999; margin-top: 4px; }

    .btn-submit {
      background: #4CAF50; color: white; border: none;
      padding: 12px 40px; border-radius: 6px; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: background 0.3s;
    }
    .btn-submit:hover { background: #43A047; }
    .btn-cancel {
      background: #fff; color: #666; border: 1px solid #ddd;
      padding: 12px 32px; border-radius: 6px; font-size: 16px;
      cursor: pointer; text-decoration: none; transition: all 0.3s;
      margin-left: 12px;
    }
    .btn-cancel:hover { border-color: #999; color: #333; }

    .msg-bar {
      padding: 12px 16px; border-radius: 6px; font-size: 14px;
      margin-bottom: 20px;
    }
    .msg-success { background: #e8f5e9; color: #2e7d32; }
    .msg-error { background: #fce4ec; color: #c62828; }
  </style>
</head>
<body>

<!-- 导航栏 -->
<div class="navbar">
  <a class="navbar-brand" href="/">仓库管理平台</a>
  <div class="navbar-right">
    <a class="nav-link" href="/user">🏠 回主页</a>
    <th:block th:if="${session.loginUser != null}">
      <span class="user-info" th:text="'👤 ' + ${session.loginUser.uname}"></span>
      <a class="btn-logout" href="/user/logout">退出登录</a>
    </th:block>
  </div>
</div>

<div class="main-wrapper">
  <!-- 面包屑 -->
  <div class="breadcrumb">
    <a href="/">首页</a><span>›</span>
    <a href="/category">品类查询</a><span>›</span>
    <a th:href="@{/category/detail(gid=${goods.gid})}" th:text="${goods.gname}">商品</a><span>›</span>
    预约
  </div>

  <!-- 提示消息 -->
  <div class="msg-bar msg-error" th:if="${msg}" th:text="${msg}"></div>

  <div class="reserve-card">
    <div class="reserve-title">📦 商品预约</div>

    <!-- 商品摘要 -->
    <div class="goods-summary">
      <div class="goods-icon">📦</div>
      <div class="goods-info">
        <h3 th:text="${goods.gname}">商品名称</h3>
        <p>
          <span th:text="${categoryName}">分类名</span> ·
          <span class="price">¥<span th:text="${goods.price}">0</span></span>/<span th:text="${goods.unit}">个</span>
          <span class="stock-tag" th:classappend="${goods.quantity > goods.alertQuantity} ? 'stock-ok' : (${goods.quantity > 0} ? 'stock-warn' : 'stock-low')"
                th:text="'库存 ' + ${goods.quantity}">库存 0</span>
        </p>
      </div>
    </div>

    <!-- 预约表单 -->
    <form th:action="@{/reservation/submit}" method="post">
      <input type="hidden" name="gid" th:value="${goods.gid}">

      <div class="form-group">
        <label>收件邮箱 <span class="required">*</span></label>
        <input type="email" name="email" placeholder="确认预约后将发送邮件通知" required>
        <div class="form-hint">预约确认后，系统将向此邮箱发送取货通知</div>
      </div>

      <div class="form-group">
        <label>预约数量 <span class="required">*</span></label>
        <input type="number" name="quantity" min="1" th:attr="max=${goods.quantity}" required
               placeholder="请输入预约数量">
        <div class="form-hint">当前库存：<span th:text="${goods.quantity}">0</span> <span th:text="${goods.unit}">个</span></div>
      </div>

      <div class="form-group">
        <label>取货时间 <span class="required">*</span></label>
        <input type="datetime-local" name="pickupTime" required>
      </div>

      <div class="form-group">
        <label>取货地点 <span class="required">*</span></label>
        <input type="text" name="pickupLocation" placeholder="例如：仓库A区3号货架" required>
      </div>

      <div>
        <button type="submit" class="btn-submit">✅ 提交预约</button>
        <a class="btn-cancel" th:href="@{/category/detail(gid=${goods.gid})}">返回详情</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
