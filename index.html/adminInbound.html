<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>出入库记录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>出入库记录</h3>
  <a href="/admin">退出返回首页</a>
</div>

<table class="table table-bordered table-hover">
  <thead>
  <tr>
    <th>ID</th>
    <th>商品ID</th>
    <th>类型</th>
    <th>数量</th>
    <th>操作人</th>
    <th>出入库时间</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="item : ${list}">
    <td>
      <span th:if="${item.getClass().name.contains('Inbound')}" th:text="${item.ibid}"></span>
      <span th:if="${item.getClass().name.contains('Outbound')}" th:text="${item.obid}"></span>
    </td>
    <td th:text="${item.gid}"></td>
    <td>
      <span th:if="${item.getClass().name.contains('Inbound')}">入库</span>
      <span th:if="${item.getClass().name.contains('Outbound')}">出库</span>
    </td>
    <td th:text="${item.quantity}"></td>
    <td th:text="${item.operator}"></td>
    <td>
      <span th:if="${item.getClass().name.contains('Inbound')}" th:text="${item.inTime}"></span>
      <span th:if="${item.getClass().name.contains('Outbound')}" th:text="${item.outTime}"></span>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
