<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>仓库管理系统 - 选择登录身份</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #f5f7fa;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .box {
      background-color: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 26px;
      color: #333;
    }
    .btn-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      width: 160px;
      line-height: 45px;
      font-size: 17px;
      text-decoration: none;
      color: #fff;
      border-radius: 5px;
      transition: background-color 0.2s;
    }
    .admin-btn {
      background-color: #2f54eb;
    }
    .admin-btn:hover {
      background-color: #2342c9;
    }
    .user-btn {
      background-color: #10b981;
    }
    .user-btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="box">
    <h1>仓库管理系统</h1>
    <div class="btn-group">
      <!-- 管理员登录 → 跳到 /login?type=admin 或直接到登录页让后端判断 -->
      <a th:href="@{/login(type='admin')}" class="admin-btn">登录</a>
      <!-- 普通用户登录 -->
    </div>
  </div>
</div>
</body>
</html>
